
name: Build and publish SWIFT-ION

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout SWIFT-ION
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build synthetic demos
        run: |
          python scripts/build_demo.py
          python scripts/build_map.py

      - name: Install browser automation
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Read upstream SWIFT-TEC (without modifying it)
        run: |
          git clone --depth 1 \
            https://github.com/sgsy4c2zh7-tech/tec_tool_globalgrid_f107_copy.git \
            _upstream_swifttec

      - name: Calculate and publish SWIFT-TEC VTEC forecast
        run: python scripts/build_live_swifttec.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
