
name: Build and publish SWIFT-ION

on:
  push:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. SWIFT-ION repository
      - name: Checkout SWIFT-ION
        uses: actions/checkout@v4

      # 2. Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Unit tests
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      # 4. Build demonstration data
      - name: Build synthetic demos
        run: |
          python scripts/build_demo.py
          python scripts/build_map.py

      # 5. Install Playwright
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      # 6. Retrieve upstream SWIFT-TEC (read-only)
      - name: Read upstream SWIFT-TEC
        run: |
          git clone --depth 1 \
            https://github.com/sgsy4c2zh7-tech/tec_tool_globalgrid_f107_copy.git \
            _upstream_swifttec

      # 7. Generate SWIFT-TEC VTEC forecast
      - name: Calculate SWIFT-TEC VTEC forecast
        run: |
          python scripts/build_live_swifttec.py

      # 8. Install IRI-2020 dependencies
      - name: Install IRI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            cmake \
            make

          python -m pip install --upgrade pip

          python -m pip install \
            "git+https://github.com/space-physics/iri2020.git"

          python -c "from iri2020 import IRI; print('IRI2020 import OK')"

      # 9. Calculate global IRI electron density
      - name: Calculate global IRI samples and TEC sensitivity scenarios
        run: |
          python scripts/build_ionosphere.py \
            --max-cells 72 \
            --max-frames 3

      # 10. Validate IRI output
      - name: Validate ionosphere JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/ionosphere.json")

          assert path.exists(), "IRI output file missing"

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          frames = data.get("frames", [])

          assert len(frames) == 3, \
              "Expected 3 UTC frames"

          for frame in frames:
              cells = frame.get("cells", [])
              map_cells = frame.get("map_cells", [])
              stats = frame.get("stats", {})

              assert len(cells) >= 54, \
                  "Insufficient real IRI calculations"

              assert len(map_cells) >= 600, \
                  "Incomplete interpolated global grid"

              assert stats.get("iri_computations") == len(cells)

              assert all(
                  c.get("method") in (
                      "IRI_RUN",
                      "SPATIAL_INTERPOLATION"
                  )
                  for c in map_cells
              )

          assert data["metadata"]["is_forecast"] is False

          print("IRI validation successful")
          print("Frames:", len(frames))

          for frame in frames:
              print(
                  frame["valid_at"],
                  "IRI cells:",
                  len(frame["cells"]),
                  "Map cells:",
                  len(frame["map_cells"])
              )
          PY

      # 11. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 12. Upload web contents
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # 13. Deploy website
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
