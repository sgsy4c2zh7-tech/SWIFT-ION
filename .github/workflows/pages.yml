name: Build and publish SWIFT-ION

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swift-ion-publish-history
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout SWIFT-ION
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build synthetic demonstrations
        run: |
          python scripts/build_demo.py
          python scripts/build_map.py

      - name: Install browser automation
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Read upstream SWIFT-TEC (read-only)
        run: |
          git clone --depth 1 \
            https://github.com/sgsy4c2zh7-tech/tec_tool_globalgrid_f107_copy.git \
            _upstream_swifttec

      - name: Calculate SWIFT-TEC VTEC forecast and 30-minute animation
        run: |
          python scripts/build_live_swifttec.py
          python scripts/check_animation.py

      - name: Fetch NOAA SWPC current scales
        run: python scripts/build_space_weather.py

      - name: Install IRI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake make
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/space-physics/iri2020.git"
          python -c "from iri2020 import IRI; print('IRI2020 import OK')"

      - name: Calculate global IRI samples and TEC sensitivity scenarios
        run: |
          python scripts/build_ionosphere.py \
            --max-cells 80 \
            --max-frames 5

      - name: Export IRI density slices for 3D globe
        run: python scripts/build_density_slices.py

      # ISEE Japan is archived VTEC, NOT current 3D electron density.
      # Re-run sparse IRI at the exact archived ISEE UTC for physically honest sections.
      - name: Build GAIA-style IRI and ISEE Japan explorer
        run: |
          python scripts/build_3d_explorer.py \
            --ionosphere docs/ionosphere.json \
            --isee-archive _upstream_swifttec/docs/data/isee_tec \
            --regional-sites 36 \
            --max-isee-frames 3 \
            --output docs/explorer_data.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/explorer_data.json').read_text(encoding='utf-8'))
          assert d['schema']=='swift-ion-explorer-v1.4'
          assert len(d['global_frames'])==5
          assert d['metadata']['is_observed_3d_density'] is False
          print('Explorer:',d['japan']['status'],'Japan frames=',len(d['japan']['frames']))
          PY

      # Experimental coupling: prospective IRI climatology + SWIFT-TEC 30-minute VTEC.
      # Does not touch original SWIFT-TEC, NOAA, ISEE, 365-day validation or artifacts.
      - name: Build 30-minute ionosphere forecast cinema
        run: |
          python scripts/build_ion_forecast.py \
            --animation docs/animation \
            --ionosphere docs/ionosphere.json \
            --output docs/ion_forecast.json \
            --max-sites 120 \
            --japan-sites 40 \
            --anchor-hours 6 \
            --global-anchor-hours 12
          python - <<'PYTEST'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/ion_forecast.json').read_text(encoding='utf-8'))
          assert d['schema']=='swift-ion-iri-tec-forecast-v1'
          assert d['metadata']['is_validated_forecast'] is False
          assert d['metadata']['is_observed_3d_density'] is False
          if d['status'] in ('AVAILABLE','HISTORICAL_REPLAY_ONLY'):
              assert len(d['frames']) >= 48
              assert all(x['valid_at'] for x in d['frames'])
          print('IRI + TEC 30-minute cinema:',d['status'],len(d['frames']),'frames')
          PYTEST

      - name: Validate ionosphere JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/ionosphere.json')
          assert p.exists(), 'IRI JSON missing'
          d = json.loads(p.read_text(encoding='utf-8'))
          assert len(d['frames']) == 5, 'Expected five UTC frames'
          for f in d['frames']:
              assert len(f['cells']) >= 60, 'Insufficient real IRI computations'
              assert len(f['map_cells']) >= 600, 'Incomplete global map grid'
              assert f['stats']['iri_computations'] == len(f['cells'])
              assert all(c['method'] in ('IRI_RUN', 'SPATIAL_INTERPOLATION') for c in f['map_cells'])
          assert d['metadata']['is_forecast'] is False
          print('IRI global profiles validated: five UTC frames')
          PY

      - name: Build science quality and retrospective reference report
        run: |
          python scripts/build_quality_report.py \
            --ionosphere docs/ionosphere.json \
            --forecast docs/swift_tec_vtec.json \
            --archive _upstream_swifttec/docs/data/tec \
            --out docs/quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('docs/quality.json').read_text(encoding='utf-8'))
          assert len(d['iri_model_diagnostics']) == 5
          print('Quality report OK:', d['retrospective_noaa_glotec']['status'])
          PY

      - name: Ionosonde verification against IRI climatology
        run: |
          python scripts/validate_ionosondes.py \
            --output docs/ionosonde_validation.json \
            --max-stations 16 \
            --max-age-hours 6 \
            --min-confidence 70
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/ionosonde_validation.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['metadata']['is_forecast_skill'] is False
          print('Ionosonde status:', d['status'], 'matched:', d['evaluated_stations'])
          PY

      - name: Prepare rolling-year archive branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin swift-ion-history >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/swift-ion-history:refs/remotes/origin/swift-ion-history
            git worktree add -b swift-ion-history _swift_ion_history origin/swift-ion-history
          else
            git worktree add --orphan -b swift-ion-history _swift_ion_history
          fi

      - name: Record prospective IRI forecasts and score a rolling 365 days
        run: |
          python scripts/build_year_archive.py \
            --observations docs/ionosonde_validation.json \
            --history _swift_ion_history \
            --docs docs
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('docs/year_accuracy.json').read_text(encoding='utf-8'))
          assert r['metadata']['retention_days']==365
          assert r['metadata']['is_swifttec_layer_forecast_skill'] is False
          assert all(x['fof2']['hit_rate_percent'] is None or 0<=x['fof2']['hit_rate_percent']<=100
                     for x in r['by_horizon'].values())
          print('Rolling-year verification:', r['status'], r['total_matches'], 'matched records')
          PY

      # Supplemental prospective evaluation of bounded SWIFT-TEC-linked foF2.
      # This writes its own tec_* files inside the SAME 365-day history worktree;
      # all existing IRI baseline archive files, retention and steps stay intact.
      - name: Record paired TEC-linked foF2 skill (365 days)
        run: |
          python scripts/build_tec_skill.py \
            --observations docs/ionosonde_validation.json \
            --model docs/ion_forecast.json \
            --history _swift_ion_history \
            --docs docs
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('docs/tec_skill.json').read_text(encoding='utf-8'))
          assert t['schema']=='swift-ion-tec-fof2-skill-365-v1'
          assert t['metadata']['retention_days']==365
          assert t['metadata']['is_validated_assimilative_forecast'] is False
          print('TEC-linked paired foF2 skill:',t['status'],t['total_matches'],'matches')
          PY

      - name: Commit 365-day history to dedicated branch
        shell: bash
        run: |
          git -C _swift_ion_history config user.name 'github-actions[bot]'
          git -C _swift_ion_history config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C _swift_ion_history add -A
          if git -C _swift_ion_history diff --cached --quiet; then
            echo 'No new verified history; existing archive preserved.'
          else
            git -C _swift_ion_history commit -m "Update station forecast and accuracy history ($GITHUB_RUN_ID)"
            git -C _swift_ion_history push -u origin HEAD:refs/heads/swift-ion-history
          fi

      - name: Save short-term workflow diagnostics (7 days)
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: swift-ion-results-${{ github.run_id }}
          path: |
            docs/quality.json
            docs/ionosonde_validation.json
            docs/station_outlook.json
            docs/prospective_skill.json
            docs/year_accuracy.json
            docs/tec_skill.json
            docs/tec_skill_daily.csv
            docs/tec_skill_monthly.csv
            docs/space_weather.json
            docs/density_slices.json
            docs/explorer_data.json
            docs/ion_forecast.json
            docs/animation/index.json
          retention-days: 7
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
