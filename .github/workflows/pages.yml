name: Build and publish SWIFT-ION
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build synthetic demos
        run: |
          python scripts/build_demo.py
          python scripts/build_map.py
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Read upstream SWIFT-TEC (without modifying it)
        run: git clone --depth 1 https://github.com/sgsy4c2zh7-tech/tec_tool_globalgrid_f107_copy.git _upstream_swifttec
      - name: Calculate and publish SWIFT-TEC VTEC forecast
        run: python scripts/build_live_swifttec.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
