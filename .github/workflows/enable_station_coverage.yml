name: Enable globally balanced ionosonde sampling

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-global-stations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update station sampling and scoring caps
        run: python scripts/apply_station_coverage_patch.py
      - name: Test balanced station selection
        run: python -m unittest discover -s tests -p 'test_station_coverage.py' -v
      - name: Check Python syntax
        run: |
          python -m py_compile scripts/station_coverage.py scripts/validate_ionosondes.py \
            scripts/build_prospective_skill.py scripts/build_year_archive.py scripts/build_tec_skill.py
      - name: Commit updates to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_ionosondes.py scripts/build_prospective_skill.py \
            scripts/build_year_archive.py scripts/build_tec_skill.py \
            .github/workflows/pages.yml docs/year.html
          if git diff --cached --quiet; then
            echo "All station coverage changes are already applied."
          else
            git commit -m "Expand globally balanced ionosonde sample to 32 stations"
            git push origin HEAD:main
          fi
