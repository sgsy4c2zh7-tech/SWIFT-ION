<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIFT-ION | SWIFT-TEC VTEC</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#0d1928;color:#e9f2ff;font:14px system-ui}header{padding:12px 16px}#map{height:75vh}select{padding:8px;max-width:100%}.warn{color:#ffd485}.legend{height:12px;width:250px;background:linear-gradient(90deg,#313695,#74add1,#ffffbf,#fdae61,#a50026)}a{color:#a3d8ff}</style></head><body><header><h2>SWIFT-ION — SWIFT-TEC VTEC import</h2><p class="warn">CSVから取り込んだTEC予報です。電離圏各層の密度予報ではありません。出力段階・予報精度は未検証です。</p><label>予報時刻 <select id="time"></select></label><p id="status">データ読み込み中…</p><div class="legend"></div><small>低 ← VTEC [TECU] → 高</small>　<a href="./map.html">合成レイヤーデモ</a></header><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([15,0],2), group=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:8}).addTo(map);let frames=[];const colors=['#313695','#74add1','#ffffbf','#fdae61','#a50026'];function render(){group.clearLayers();const frame=frames[Number(document.getElementById('time').value)];if(!frame)return;const vals=frame.cells.map(c=>c.vtec_tecu),min=Math.min(...vals),max=Math.max(...vals);document.getElementById('status').textContent=frame.valid_at+' | VTEC '+min.toFixed(1)+'–'+max.toFixed(1)+' TECU | '+frame.cells.length+' cells';for(const c of frame.cells){const k=Math.min(4,Math.floor(5*(c.vtec_tecu-min)/(max-min||1)));L.circleMarker([c.lat,c.lon],{radius:5,stroke:false,fillColor:colors[k],fillOpacity:.8}).bindPopup('VTEC: '+c.vtec_tecu.toFixed(2)+' TECU<br>'+frame.valid_at).addTo(group)}}fetch('./swift_tec_vtec.json').then(r=>{if(!r.ok)throw Error('CSV未取込');return r.json()}).then(d=>{frames=d.frames;const s=document.getElementById('time');frames.forEach((f,i)=>s.add(new Option(f.valid_at,String(i))));s.onchange=render;render()}).catch(e=>document.getElementById('status').textContent='データなし: '+e.message+'。CSVを配置しGitHub Actionsを実行してください。');
</script></body></html>
