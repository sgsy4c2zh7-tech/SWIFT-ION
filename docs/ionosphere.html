<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIFT-ION | IRI model estimates</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#0d1928;color:#e9f2ff;font:14px system-ui}header{padding:16px}#map{height:70vh}select{padding:8px}a{color:#a3d8ff}.warn{color:#ffd485}#profile{padding:12px;white-space:pre-wrap}#legend{height:12px;width:280px;background:linear-gradient(90deg,#313695,#74add1,#ffffbf,#fdae61,#a50026)}</style></head><body><header><h2>SWIFT-ION — IRI electron density model</h2><p class="warn">IRIのモデル推定値。SWIFT-TECのTEC予報とは比較のみで、同化・各層の予報は未実装。D層は対象外。</p><label>指標 <select id="metric"><option value="nmf2_m3">NmF2 (m⁻³)</option><option value="hmf2_km">hmF2 (km)</option><option value="fof2_mhz">foF2 (MHz)</option><option value="iri_partial_tec_100_600_tecu">IRI partial TEC 100–600 km</option><option value="vtec_swifttec_tecu">SWIFT-TEC VTEC</option></select></label><p id="status">読み込み中…</p><div id="legend"></div><small>低 ← 指標値 → 高</small>　<a href="./tec.html">SWIFT-TECマップ</a></header><div id="map"></div><div id="profile">地点をクリックすると電子密度の鉛直プロファイルを表示します。</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([15,0],2),group=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let cells=[];const colors=['#313695','#74add1','#ffffbf','#fdae61','#a50026'];function render(){group.clearLayers();const key=document.getElementById('metric').value;const vals=cells.map(c=>key in c?c[key]:c.iri[key]).filter(Number.isFinite);if(!vals.length)return;const min=Math.min(...vals),max=Math.max(...vals);document.getElementById('status').textContent=`${cells.length} model cells | ${key}: ${min.toPrecision(3)}–${max.toPrecision(3)}`;for(const c of cells){const v=key in c?c[key]:c.iri[key];if(!Number.isFinite(v))continue;const k=Math.max(0,Math.min(4,Math.floor(5*(v-min)/(max-min||1))));L.circleMarker([c.lat,c.lon],{radius:7,stroke:false,fillColor:colors[k],fillOpacity:.9}).on('click',()=>{const p=c.profile;document.getElementById('profile').textContent=`Lat ${c.lat}, Lon ${c.lon}\nIRI NmF2=${c.iri.nmf2_m3.toExponential(3)} m⁻³ | hmF2=${c.iri.hmf2_km} km | foF2=${c.iri.fof2_mhz} MHz\n\nAltitude km | Ne m⁻³\n`+p.alt_km.map((h,i)=>`${h} | ${p.ne_m3[i].toExponential(3)}`).join('\n')}).addTo(group)}}document.getElementById('metric').onchange=render;fetch('./ionosphere.json').then(r=>{if(!r.ok)throw Error('IRIデータ未生成');return r.json()}).then(d=>{cells=d.frames[0]?.cells||[];if(!cells.length)throw Error('IRIセルなし');render()}).catch(e=>document.getElementById('status').textContent=e.message+'。IRIモデルを有効化・実行してください。');
</script></body></html>
