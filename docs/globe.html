<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIFT-ION | 3D IRI Electron Density</title>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.133.0/Build/Cesium/';</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.133.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.133.0/Build/Cesium/Cesium.js"></script>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071525;color:#eaf2fc;font:14px/1.6 system-ui,sans-serif}header{padding:14px 20px;background:#0e2335;border-bottom:1px solid #305069}h1{font-size:24px;margin:0}nav{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 10px}a{color:#96dcff}.notice{color:#f6d6a5;font-size:12px;margin:7px 0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:#102b40;padding:12px 20px}label{color:#c3d4e5;font-size:12px;display:flex;flex-direction:column;gap:4px}select,input{font:inherit;background:#183950;border:1px solid #517b91;border-radius:6px;color:white;padding:7px}input[type=range]{min-width:170px}#globe{height:calc(100vh - 265px);min-height:480px;background:#0d283f}footer{padding:10px 20px;background:#0e2335;font-size:12px;color:#b8cddf}.ramp{display:inline-block;vertical-align:middle;width:190px;height:10px;background:linear-gradient(to right,#253a7a,#4b9dc7,#8dccac,#f8cf74,#d66a59);border-radius:4px}.cesium-widget-credits{bottom:3px!important}.badge{color:#a7e4ff}@media(max-width:720px){#globe{height:63vh;min-height:360px}}</style></head><body><header><h1>SWIFT-ION <span style="color:#86d5f5">IRI 3D Density Shell</span></h1><nav><a href="./index.html">Dashboard</a><a href="./animate.html">30分VTEC</a><a href="./impact.html">Flight Route</a><a href="./ops.html">Space Weather</a><a href="./year.html">1年精度</a></nav><p class="notice">IRI-2020気候モデルの疎な計算地点を空間補間した、高度別電子密度の点群表示。連続した3D観測値でも検証済みの電子密度予報でもありません。時間補間もモデル表示上の近似です。</p></header>
<div class="toolbar"><label>IRI計算対象時刻（UTC）<select id="time" disabled></select></label><label>高度層 <select id="alt" disabled></select></label><label>プロット表示<select id="show"><option value="all">全球格子（補間含む）</option><option value="none">非表示</option></select></label><label>見た目の点サイズ<input id="size" type="range" min="2" max="10" value="5" step="1"></label><label>色尺度 <span class="ramp"></span><span>log10(Ne [m⁻³]) / 7〜13</span></label></div>
<div id="globe"></div><footer><span class="badge" id="status">Cesium 3DとIRIデータを読み込み中…</span> <span id="click"></span> — 衛星通信・GNSSの運用可用性や部隊ルートを推定する用途ではありません。CesiumJS・OpenStreetMapタイルの読込にはネット接続が必要。</footer>
<script type="module">
const $=id=>document.getElementById(id),colors=[[38,52,127],[59,141,199],[128,207,187],[247,204,112],[209,91,81]];
function color(v){if(!Number.isFinite(v))return Cesium.Color.GRAY;let q=Math.max(0,Math.min(3.99999,(v-7)/6*4)),i=Math.floor(q),t=q-i;return new Cesium.Color(...[0,1,2].map(j=>(colors[i][j]*(1-t)+colors[i+1][j]*t)/255),.86)}
if(!window.Cesium){$('status').textContent='CesiumJSの読み込みに失敗';throw Error('Cesium unavailable')}
let viewer;try{viewer=new Cesium.Viewer('globe',{baseLayerPicker:false,baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:true,sceneModePicker:true,navigationHelpButton:false,fullscreenButton:false,infoBox:true,selectionIndicator:true,requestRenderMode:true,maximumRenderTimeChange:Infinity});viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',maximumLevel:7,credit:new Cesium.Credit('© OpenStreetMap contributors')}));viewer.scene.globe.enableLighting=false;viewer.camera.flyHome(0);}
catch(e){$('status').textContent='3D初期化失敗: '+e.message;throw e}
let data=null,entities=[];
function redraw(){if(!data)return;entities.forEach(e=>viewer.entities.remove(e));entities=[];if($('show').value==='none'){viewer.scene.requestRender();return}
 const index=Number($('time').value),hi=Number($('alt').value),f=data.frames[index],heightKm=data.heights_km[hi];let count=0;let num=0;
 for(let i=0;i<data.coordinates.length;i++){const v=f.values_log10_ne_m3[i]?.[hi];if(!Number.isFinite(v))continue;const [lat,lon]=data.coordinates[i];const e=viewer.entities.add({name:`IRI model at ${heightKm} km`,position:Cesium.Cartesian3.fromDegrees(lon,lat,heightKm*1000),point:{pixelSize:Number($('size').value),color:color(v),outlineColor:Cesium.Color.fromCssColorString('#091b29'),outlineWidth:1},description:`緯度: ${lat.toFixed(1)}°, 経度: ${lon.toFixed(1)}°<br>高度: ${heightKm} km<br>電子密度: ${Math.pow(10,v).toExponential(3)} m⁻³<br>log10 Ne: ${v}<br>IRIモデル＋空間補間（観測値ではありません）`});entities.push(e);count++;num+=v}
 $('status').textContent=`UTC ${f.valid_at} ｜ 高度 ${heightKm} km ｜ ${count}表示格子 ｜ IRI実計算 ${f.iri_source_sites}地点 ｜ Ne推定（補間）`;viewer.scene.requestRender();}
for(const id of ['time','alt','show','size'])$(id).addEventListener('change',redraw);
try{const response=await fetch('./density_slices.json',{cache:'no-store'});if(!response.ok)throw Error('density_slices.json HTTP '+response.status);const result=await response.json();if(result.schema!=='swift-ion-iri-slices-v1')throw Error('IRI高度データ形式不一致');data=result;data.frames.forEach((f,i)=>$('time').add(new Option(f.valid_at,String(i))));data.heights_km.forEach((h,i)=>$('alt').add(new Option(h+' km',String(i))));$('time').disabled=false;$('alt').disabled=false;$('alt').value=String(data.heights_km.indexOf(300)>=0?data.heights_km.indexOf(300):0);redraw();}
catch(e){$('status').textContent='IRI 3Dデータ未取得: '+e.message+'。ActionsのExport IRI density slicesを確認してください。'}
</script></body></html>
