<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIFT-ION</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:25px auto;padding:0 18px;background:#0e1b2a;color:#e9f0f8}h1{color:#88d5f0}.warn{background:#463a19;padding:14px;border-radius:10px}.card{background:#1b3047;border-radius:12px;padding:16px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #456}small{color:#c8d5e0}</style></head><body><h1>SWIFT-ION</h1><p class="warn"><b>研究用デモ — 実予報ではありません。</b> 表示される電子密度は合成データです。運用判断には使用できません。</p><div class="card"><h2>電離圏 D / E / F1 / F2</h2><div id="layers">デモデータ読み込み中…</div></div><div class="card"><h2>HF通信</h2><p>伝搬モデル未接続。MUF / LUF / FOTの数値は出力しません。</p></div><div class="card"><h2>GNSS</h2><p id="gnss">1次遅延の計算例を読み込み中…</p></div><div class="card"><h2>衛星通信・レーダー</h2><p>伝搬モデル未接続。</p></div><div class="card"><h2>宇宙天気警戒</h2><p>観測・閾値未接続。警戒判定は未実装。</p></div><small>SWIFT-TECと独立した公開データ研究基盤。実予報、観測、合成データを混同しません。</small><script>fetch('./demo.json').then(r=>{if(!r.ok)throw Error('missing demo.json');return r.json()}).then(d=>{let rows=Object.entries(d.layers).map(([name,v])=>`<tr><th>${name}</th><td>${v.band_max_ne_m3===null?'—':v.band_max_ne_m3.toExponential(3)}</td><td>${v.band_max_altitude_km??'—'}</td></tr>`).join('');document.getElementById('layers').innerHTML='<p>高度帯内の最大値（層ピークの確定値ではありません）</p><table><tr><th>層</th><th>Ne [m⁻³]</th><th>高度 [km]</th></tr>'+rows+'</table><p>合成TEC (60–600 km): '+d.tec_60_600_tecu.toFixed(2)+' TECU</p>';document.getElementById('gnss').textContent='10 TECU / GPS L1 の群遅延例: '+d.gnss.example_L1_delay_m.toFixed(2)+' m（測位誤差予報ではありません）'}).catch(e=>document.getElementById('layers').textContent='デモJSON未生成: GitHub Actionsでbuild_demoを実行してください');</script></body></html>
