<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIFT-ION | Custom foF2 TEC Heatmaps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071626;color:#e4f3ff;font:13px/1.55 system-ui,sans-serif}a{color:#89dffa}header{padding:17px 26px;background:#0c2a40;border-bottom:1px solid #2b546c}h1{margin:0 0 5px;font-size:22px}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:11px;padding:12px 26px;background:#0c2538}label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#bfdaea}select,input,button{padding:8px;color:#edf7ff;background:#183d56;border:1px solid #4b7691;border-radius:8px;font:inherit}input[type=number]{width:95px}input[type=range]{padding:0}button{cursor:pointer}main{padding:12px 26px}#map{height:min(70vh,720px);min-height:360px;background:#0a2134;border:1px solid #2d586d;border-radius:12px}#src{display:none}.stat{margin:8px 0;padding:10px;background:#0c2b42;border-radius:8px;color:#bad7e9}.legend{display:flex;align-items:center;gap:12px;margin:9px 0}.ramp{height:12px;width:230px;border-radius:6px;background:linear-gradient(to right,#141f70,#1452c0,#33b0c5,#83ce8b,#ffe365,#eb6a31,#b92039)}.warn{font-size:12px;color:#ffda9e;margin:9px 0}#time{width:100%;accent-color:#71d4e7}body:fullscreen #map{height:73vh}@media(max-width:640px){.controls,main{padding-left:9px;padding-right:9px}}
</style></head><body><header><h1>SWIFT-ION｜カスタム・ヒートマップ</h1><nav><a href="./index.html">ホーム</a> · <a href="./nict_compare.html">NICT 4地点比較</a> · <a href="./field.html">標準foF2動画</a></nav><div class="warn">予報値のカラー表示のみを編集します。モデル・観測値・有効範囲は変更しません。</div></header>
<section class="controls">
<label>物理量<select id="metric"><option value="fof2">foF2 [MHz]</option><option value="hmf2">hmF2 [km]</option><option value="tec">VTEC [TECU]</option><option value="ne">log₁₀ Ne [m⁻³] (300 km)</option></select></label>
<label>予報<select id="variant"><option value="iri">IRI基準</option><option value="tec">TEC連動シナリオ（実験）</option></select></label>
<label>範囲<select id="region"><option value="japan">日本周辺</option><option value="global">全球</option></select></label>
<label>色<select id="palette"><option value="turbo">Turbo</option><option value="viridis">Viridis</option><option value="plasma">Plasma</option><option value="thermal">Thermal</option><option value="blue-red">Blue–Red</option></select></label>
<label>色尺度の最小値<input id="min" type="number" step="0.1"></label><label>最大値<input id="max" type="number" step="0.1"></label>
<label>透明度 <span id="alphaLabel">70%</span><input id="alpha" type="range" min="10" max="100" value="70" step="5"></label>
<button id="save">色設定を保存</button><button id="reset">初期値へ</button><button id="play">▶ 再生</button><button id="fullscreen">⛶ 全画面</button>
</section><main><div class="stat" id="status">予報を読み込み中…</div><input id="time" type="range" min="0" max="0" value="0" disabled><div id="map"></div><canvas id="src"></canvas><div class="legend"><span id="lo">—</span><span class="ramp" id="ramp"></span><span id="hi">—</span><small id="details"></small></div><p class="warn">IRI計算点のない場所には新しい数値を作りません。距離重み付けの表示とモデル値の解像度は別です。大きく離れた地域は透明にし、計算点の周りに薄くフェードします。</p></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import {PALETTES,getWeights,valid} from './shared/gaia3d.mjs';
const $=s=>document.getElementById(s),q={data:null,i:0,timer:null,map:null,layer:null,cache:null};const ranges={fof2:[1,18],hmf2:[150,550],tec:[0,100],ne:[8,12.8]};
const schemes={...PALETTES,'blue-red':[[10,34,97],[35,106,191],[90,190,220],[203,232,204],[255,221,145],[232,121,66],[159,29,58]]};
const bounds={japan:{w:121,e:152,s:23,n:47},global:{w:-180,e:180,s:-75,n:75}};
function prefs(){try{return JSON.parse(localStorage.getItem('swift_ion_palette_'+$('metric').value))||{}}catch{return {}}}
function setPrefs(){const a=prefs(),r=ranges[$('metric').value];$('min').value=a.min??r[0];$('max').value=a.max??r[1];$('palette').value=a.palette||'turbo';$('alpha').value=a.alpha||70;$('alphaLabel').textContent=$('alpha').value+'%';updateRamp()}
function updateRamp(){const colors=schemes[$('palette').value]||schemes.turbo;$('ramp').style.background='linear-gradient(90deg,'+colors.map(v=>`rgb(${v.join(',')})`).join(',')+')';$('lo').textContent=$('min').value;$('hi').textContent=$('max').value}
function scheme(t){const a=schemes[$('palette').value]||schemes.turbo,k=Math.max(0,Math.min(.99999,t))*(a.length-1),lo=Math.floor(k),t1=k-lo;return a[lo].map((v,i)=>Math.round(v*(1-t1)+a[lo+1][i]*t1))}
function atSite(s){if($('metric').value==='fof2')return $('variant').value==='tec'?s.fof2_tec_mhz:s.fof2_iri_mhz;if($('metric').value==='hmf2')return s.hmf2_iri_km;if($('metric').value==='tec')return s.vtec_forecast_tecu;const a=$('variant').value==='tec'?s.tec_ne_log10_m3:s.iri_ne_log10_m3;const k=q.data.altitudes_km.indexOf(300);return a?.[k]??null}
function mapB(){const b=bounds[$('region').value];return L.latLngBounds([[b.s,b.w],[b.n,b.e]])}
const merc=lat=>Math.log(Math.tan(Math.PI/4+Math.max(-85,Math.min(85,lat))*Math.PI/360));const invMerc=y=>(2*Math.atan(Math.exp(y))-Math.PI/2)*180/Math.PI;
function draw(){if(!q.data)return;const b=bounds[$('region').value],r=q.data.frames[q.i],ss=$('region').value==='japan'?r.sites.filter(s=>s.lat>21&&s.lat<50&&s.lon>118&&s.lon<156):r.sites;const nx=180,ny=115,min=Number($('min').value),max=Number($('max').value);if(!Number.isFinite(min)||!Number.isFinite(max)||max<=min){$('status').textContent='色尺度は最大値が最小値より大きい必要があります';return}
 const cv=$('src');cv.width=nx;cv.height=ny;const cx=cv.getContext('2d'),pixels=cx.createImageData(nx,ny);let ok=0;const mt=merc(b.n),mb=merc(b.s);const key=$('region').value+'|'+ss.map(s=>`${s.lat},${s.lon}`).join('|');if(!q.cache||q.cache.key!==key){const weights=[];for(let j=0;j<ny;j++){const lat=invMerc(mt+(mb-mt)*(j+.5)/ny);for(let i=0;i<nx;i++){const lon=b.w+(b.e-b.w)*(i+.5)/nx;weights.push(getWeights(ss,lat,lon,$('region').value));}}q.cache={key,weights}}
 const alpha=Number($('alpha').value)/100;for(let k=0;k<nx*ny;k++){const ww=q.cache.weights[k];let sum=0,den=0;for(const w of ww){const v=atSite(ss[w.i]);if(valid(v)){sum+=v*w.w;den+=w.w}}if(!den)continue;const col=scheme((sum/den-min)/(max-min)),o=k*4;pixels.data[o]=col[0];pixels.data[o+1]=col[1];pixels.data[o+2]=col[2];pixels.data[o+3]=255;ok++}cx.putImageData(pixels,0,0);const url=cv.toDataURL('image/png');if(q.layer){q.layer.setBounds(mapB());q.layer.setUrl(url)}else q.layer=L.imageOverlay(url,mapB(),{opacity:alpha,interactive:false}).addTo(q.map);q.layer.setOpacity(alpha);
 $('time').value=q.i;$('status').textContent=`${r.valid_at} UTC | ${q.i+1}/${q.data.frames.length} フレーム | ${ss.length} IRI計算点 | ${$('metric').value} (${q.data.status})`;$('details').textContent='有効画像セル '+ok+'/'+(nx*ny);updateRamp();}
function step(){q.i=(q.i+1)%q.data.frames.length;draw()}
function stop(){clearInterval(q.timer);q.timer=null;$('play').textContent='▶ 再生'}
$('play').onclick=()=>{if(q.timer){stop();return}q.timer=setInterval(step,650);$('play').textContent='⏸ 停止'};
$('time').oninput=e=>{stop();q.i=Number(e.target.value);draw()};$('metric').onchange=()=>{setPrefs();draw()};$('variant').onchange=draw;$('region').onchange=()=>{q.cache=null;q.map.fitBounds(mapB());draw()};
for(const k of ['min','max','palette'])$(k).onchange=draw;$('alpha').oninput=e=>{$('alphaLabel').textContent=e.target.value+'%';if(q.layer)q.layer.setOpacity(Number(e.target.value)/100)};
$('save').onclick=()=>{localStorage.setItem('swift_ion_palette_'+$('metric').value,JSON.stringify({min:Number($('min').value),max:Number($('max').value),palette:$('palette').value,alpha:Number($('alpha').value)}));draw()};
$('reset').onclick=()=>{localStorage.removeItem('swift_ion_palette_'+$('metric').value);setPrefs();draw()};$('fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen();setTimeout(()=>q.map.invalidateSize(),250)}catch(e){$('status').textContent='全画面エラー: '+e.message}};
q.map=L.map('map',{zoomControl:true}).setView([34,136],5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:11}).addTo(q.map);q.map.fitBounds(mapB());
try{const r=await fetch('./ion_forecast.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);q.data=await r.json();if(q.data.schema!=='swift-ion-iri-tec-forecast-v1'||!q.data.frames?.length)throw Error('予報未生成');$('time').max=q.data.frames.length-1;const first=q.data.frames.findIndex(x=>x.is_prospective);q.i=first<0?0:first;$('time').disabled=false;setPrefs();draw()}catch(e){$('status').textContent='予報読み込みエラー: '+e.message}window.addEventListener('pagehide',stop);
</script></body></html>
