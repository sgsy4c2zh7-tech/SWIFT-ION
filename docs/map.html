<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIFT-ION Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#0e1b2a;color:#edf4fa;font:15px system-ui}header{padding:12px 18px}h1{margin:0;font-size:22px}.warn{color:#ffd782}main{display:grid;grid-template-columns:220px 1fr}aside{padding:16px;background:#20354c}label{display:block;margin:15px 0 5px}select{width:100%;padding:8px}#map{height:calc(100vh - 88px);min-height:450px}.scale{height:13px;background:linear-gradient(90deg,#2b83ba,#abdda4,#ffffbf,#fdae61,#d7191c)}.ends{display:flex;justify-content:space-between;font-size:12px}a{color:#9fd9ff}@media(max-width:650px){main{display:block}aside{display:flex;gap:12px;flex-wrap:wrap}aside>div{min-width:130px;flex:1}#map{height:65vh}}</style></head><body><header><h1>SWIFT-ION — 2D Global Ionosphere</h1><div class="warn">合成データの研究用デモ。実際の観測・予報ではなく、運用判断には使用できません。</div></header><main><aside><div><label for="layer">電離圏層</label><select id="layer"><option>D</option><option>E</option><option>F1</option><option selected>F2</option></select></div><div><label for="metric">表示値</label><select id="metric"><option value="ne_m3">電子密度 [m⁻³]</option><option value="height_km">代表高度 [km]</option></select></div><div><p>低 → 高</p><div class="scale"></div><div class="ends"><span id="min"></span><span id="max"></span></div><p>10°格子。クリックで値を表示。高度は例示値で、確認済み層ピークではありません。</p><a href="./index.html">既存ダッシュボード</a></div></aside><div id="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{minZoom:2}).setView([15,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:7}).addTo(map);const group=L.layerGroup().addTo(map);let data;const colors=['#2b83ba','#abdda4','#ffffbf','#fdae61','#d7191c'];
function render(){if(!data)return;group.clearLayers();let layer=document.getElementById('layer').value,metric=document.getElementById('metric').value;let values=data.cells.map(c=>c.layers[layer][metric]);let lo=Math.min(...values),hi=Math.max(...values);let fmt=v=>metric==='ne_m3'?v.toExponential(2):v.toFixed(1);document.getElementById('min').textContent=fmt(lo);document.getElementById('max').textContent=fmt(hi);for(const c of data.cells){let v=c.layers[layer][metric],idx=Math.min(4,Math.floor(5*(v-lo)/(hi-lo||1)));L.rectangle([[c.lat-5,c.lon-5],[c.lat+5,c.lon+5]],{stroke:false,fillColor:colors[idx],fillOpacity:.68}).bindPopup(layer+'層（合成）<br>緯度 '+c.lat+'° / 経度 '+c.lon+'°<br>'+fmt(v)+(metric==='ne_m3'?' m⁻³':' km')).addTo(group)}}
document.getElementById('layer').onchange=render;document.getElementById('metric').onchange=render;fetch('./map.json').then(r=>{if(!r.ok)throw Error('map.json missing');return r.json()}).then(d=>{if(d.metadata.is_forecast||d.metadata.is_observation)throw Error('Unexpected data');data=d;render()}).catch(e=>alert('地図データを読み込めません: '+e.message));
</script></body></html>
